<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Download TikTok videos quickly with our simple TikTok downloader."
    >

    <title>TikTok Downloader</title>

    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon.svg">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TikTok DL">
</head>

<body>

    <div id="bootScreen" class="boot-screen">
        <div class="boot-logo">TT</div>
        <h2>TikTok Downloader</h2>
        <p id="bootText">Initializing...</p>
        <div class="boot-loader">
            <div class="boot-progress"></div>
        </div>
    </div>


    <main class="container">

        <div class="logo">TT</div>

        <h1>TikTok Downloader</h1>

        <p class="subtitle">
            Download TikTok videos without a watermark.
        </p>

        <div class="downloader-card">

            <div class="input-wrapper">

                <input
                    type="url"
                    id="url"
                    placeholder="Paste TikTok video link..."
                    autocomplete="off"
                >

                <button id="pasteBtn" type="button">
                    <span class="btn-icon">▣</span>
                    <span>Paste</span>
                </button>

            </div>

            <div class="actions">

                <button id="downloadBtn" class="primary-btn">
                    <span class="btn-icon">↓</span>
                    <span>Download Video</span>
                </button>

                <button id="clearBtn" class="clear-btn" type="button">
                    <span class="btn-icon">×</span>
                    <span>Clear</span>
                </button>

            </div>

            <div id="status"></div>

            <div id="result"></div>

        </div>

        <section class="history-card" id="historyCard" hidden>
            <div class="history-header">
                <strong>Download History</strong>
                <button id="clearHistoryBtn" type="button">Clear History</button>
            </div>

            <div id="historyList"></div>
        </section>

        <div class="features">

            <div class="feature">
                <span>🚀</span>
                <strong>Fast</strong>
                <small>Quick processing</small>
            </div>

            <div class="feature">
                <span>✨</span>
                <strong>No Watermark</strong>
                <small>When available</small>
            </div>

            <div class="feature">
                <span>📱</span>
                <strong>Mobile</strong>
                <small>Works on Android &amp; iOS</small>
            </div>

        </div>

        <p class="footer">
            Paste a TikTok link above to get started.
        </p>

    </main>

    <script src="/static/script.js"></script>

</body>
</html>
